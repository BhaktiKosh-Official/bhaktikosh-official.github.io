<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BhaktiKhoj - Official</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #FFF8F0; 
            color: #5D4037; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
            border-top: 5px solid #8B4513; 
        }
        h1 { 
            color: #8B4513; 
            margin-bottom: 5px; 
        }
        .subtitle {
            font-size: 1.1em; 
            margin-bottom: 10px; 
            opacity: 0.8; 
        }
        .badge {
            background-color: #d35400;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
        }
        .btn { 
            display: block; 
            padding: 12px; 
            margin: 10px 0; 
            background: #8B4513; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .btn:hover { 
            background: #D35400; 
            transform: translateY(-2px); 
        }
        .footer { 
            margin-top: 25px; 
            font-size: 0.85em; 
            color: #777; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>भक्ति खोज 🚩</h1>
        <div class="subtitle">सनातन धर्म का डिजिटल महासागर</div>
        <div class="badge">V2.0 - Major Update</div>
        
        <a href="privacy-policy.html" class="btn">Privacy Policy</a>
        <a href="terms-and-conditions.html" class="btn">Terms & Conditions</a>
        
        <div class="footer">धर्मो रक्षति रक्षितः | Made in Bharat</div>
    </div>
</body>
</html>
